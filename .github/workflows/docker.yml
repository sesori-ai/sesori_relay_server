name: Docker Build & Verify

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: remote-relay:ci

      - name: Start container
        run: |
          docker run -d --name relay-ci -p 8080:8080 remote-relay:ci
          sleep 2

      - name: Health check
        run: |
          response=$(curl -sf http://localhost:8080/health)
          echo "Health response: $response"
          echo "$response" | jq -e '.status == "ok"'

      - name: Stop container
        if: always()
        run: docker rm -f relay-ci || true

  go-vet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build relay binary
        run: go build -o /dev/null ./cmd/relay/
